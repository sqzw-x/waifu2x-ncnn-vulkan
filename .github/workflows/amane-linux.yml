# 上游只发布 x86_64 Linux 包, 且其纯 CPU 模式会段错误 (缺少 Vulkan 设备时) — linux/arm64 与无 GPU 的容器都需要重建.
# 本 workflow 用同一份源码重建两个架构的包, 产物挂在 tag `amane-*` 的 release 上 (Amane 按此 URL 下载).
# 源码为上游 master 64914665 (与发布 tag 20250915 一致), 差异仅在 CI 文件与两处 CPU 路径修复.
name: amane linux

on:
  workflow_dispatch:
  push:
    tags:
      - "amane-*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            arch: arm64
          - runner: ubuntu-24.04
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    # glibc 2.35: 覆盖 Debian 12 / Ubuntu 22.04 及以上
    container: ubuntu:22.04
    env:
      NAME: waifu2x-ncnn-vulkan-20250915-linux-${{ matrix.arch }}
    steps:
      - name: 安装构建依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake g++ git libgomp1 libvulkan1 make unzip zip

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 编译
        run: |
          cmake -S src -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: 打包
        run: |
          mkdir -p "pkg/$NAME"
          cp README.md LICENSE "pkg/$NAME/"
          cp build/waifu2x-ncnn-vulkan "pkg/$NAME/"
          strip -g "pkg/$NAME/waifu2x-ncnn-vulkan"
          cp -r models/. "pkg/$NAME/"
          (cd pkg && zip -9 -r "$NAME.zip" "$NAME")
          unzip -l "pkg/$NAME.zip"

      - name: 崩溃回溯 (诊断, 临时)
        if: matrix.arch == 'x86_64'
        shell: bash
        continue-on-error: true
        run: |
          set +e
          apt-get install -y --no-install-recommends gdb
          echo "--- CPU ---"
          grep -m1 "model name" /proc/cpuinfo
          grep -o "avx512[a-z0-9_]*\|fma\|avx2\|avx" /proc/cpuinfo | sort -u | tr "\n" " "
          echo
          echo "--- 带调试信息重建 ---"
          cmake -S src -B build-dbg -DCMAKE_BUILD_TYPE=RelWithDebInfo >/dev/null
          cmake --build build-dbg -j"$(nproc)" >/dev/null 2>&1
          cp build-dbg/waifu2x-ncnn-vulkan "pkg/$NAME/dbg"
          echo "--- gdb 回溯 ---"
          cd "pkg/$NAME"
          gdb -batch -ex "set pagination off" -ex run -ex "bt 20" -ex "info registers rip" --args \
            ./dbg -i "$GITHUB_WORKSPACE/images/0.jpg" -o "$GITHUB_WORKSPACE/diag.jpg" \
            -m models-upconv_7_photo -s 2 -f jpg 2>&1 | tail -40

      - name: 冒烟测试 (无 Vulkan 驱动, 走 CPU)
        shell: bash
        run: |
          cd "pkg/$NAME"
          ./waifu2x-ncnn-vulkan -i "$GITHUB_WORKSPACE/images/0.jpg" -o "$GITHUB_WORKSPACE/smoke-cpu.jpg" \
            -m models-upconv_7_photo -s 2 -f jpg
          ls -l "$GITHUB_WORKSPACE/smoke-cpu.jpg"

      - name: 冒烟测试 (装 lavapipe 后走 GPU 路径)
        shell: bash
        run: |
          cd "pkg/$NAME"
          apt-get install -y --no-install-recommends mesa-vulkan-drivers
          ./waifu2x-ncnn-vulkan -i "$GITHUB_WORKSPACE/images/0.jpg" -o "$GITHUB_WORKSPACE/smoke-gpu.jpg" \
            -m models-upconv_7_photo -s 2 -f jpg
          ls -l "$GITHUB_WORKSPACE/smoke-gpu.jpg"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: pkg/${{ env.NAME }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          name: linux 制品 (${{ github.ref_name }})
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            上游只发布 x86_64 Linux 包, 且其纯 CPU 模式会段错误, 无 Vulkan 设备的 Linux 上一律不可用.
            这里用同一份源码重建 x86_64 与 arm64 两个包.

            - 源码: 上游 master `64914665` (与发布 tag `20250915` 的源码一致) + 两处 CPU 路径修复
            - 构建: GitHub runner (`ubuntu-24.04-arm` / `ubuntu-24.04`), `ubuntu:22.04` 容器 (glibc 2.35)
            - 运行期依赖: `libgomp1`; 有 Vulkan 驱动与设备时走 GPU, 没有时自动走 CPU
            - 与上游的差异 (上游在该两处会段错误, 即上游的纯 CPU 模式不可用):
              1. 无 Vulkan 驱动或设备时跳过 GPU 初始化
              2. `Waifu2x::load` 在 CPU 模式下不再调用 `Net::set_vulkan_device` (ncnn 会解引用空指针)
            - 内容: `waifu2x-ncnn-vulkan` 与 `models/` 下的三个模型目录
